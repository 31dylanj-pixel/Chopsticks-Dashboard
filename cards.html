<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Library - Chopsticks Hub</title>
    <meta name="description" content="Browse every obtainable card in Chopsticks.">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="theme.js"></script>
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-hero">
    <span class="eyebrow">CHOPSTICKS HUB</span>
    <h1>Card Library</h1>
    <p>Browse every obtainable card and what it sells for.</p>
</header>

<main class="page-main">

    <div class="toolbar">
        <label class="search">
            <span class="sr-only">Search for a card...</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="card-search" placeholder="Search for a card..." autocomplete="off">
        </label>
        <div class="chips" id="card-chips" role="group" aria-label="Filters"></div>
        <span class="result-count" id="card-count" aria-live="polite"></span>
    </div>

    <div id="card-container"></div>

    <div class="empty-state" id="emptyState" hidden>
        <strong>Nothing found</strong>
        Try a different search or filter.
    </div>

</main>

<script src="data/cards.js"></script>
<script src="cards.js"></script>

<script src="ocean.js" defer></script>
</body>
</html>
