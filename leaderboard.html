<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Chopsticks Hub</title>
    <meta name="description" content="See who is leading the game.">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="theme.js"></script>
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="top">

<header class="page-hero">
    <a class="back-home" href="index.html"><span aria-hidden="true">&larr;</span> Back to home</a>
    <span class="eyebrow">CHOPSTICKS HUB</span>
    <h1>Leaderboard</h1>
    <p>See who's leading the game. Click a player for their stats.</p>
</header>

<main class="page-main">
    <div class="toolbar">
        <label class="search">
            <span class="sr-only">Search players</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="lb-search" placeholder="Search players..." autocomplete="off">
        </label>
        <div class="lb-status">
            <span class="result-count" id="lb-count" aria-live="polite"></span>
            <span class="result-count" id="lb-updated"></span>
        </div>
    </div>

    <div id="leaderboard" aria-live="polite"></div>

    <div class="page-footer">
        <a class="btn" href="index.html"><span aria-hidden="true">&larr;</span> Back to home</a>
        <a class="btn" href="#top">Back to top</a>
    </div>
</main>

<script src="leaderboard.js"></script>

<script src="account.js" defer></script>
<script src="ocean.js" defer></script>
</body>
</html>
