<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Library - Chopsticks Hub</title>
    <meta name="description" content="Discover every fish in Chopsticks.">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="theme.js"></script>
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="top">

<header class="page-hero">
    <a class="back-home" href="index.html"><span aria-hidden="true">&larr;</span> Back to home</a>
    <span class="eyebrow">CHOPSTICKS HUB</span>
    <h1>Fish Library</h1>
    <p>Discover every fish in Chopsticks. Click any fish to open its profile.</p>
</header>

<main class="page-main">

    <div class="toolbar">
        <label class="search">
            <span class="sr-only">Search for a fish...</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="fish-search" placeholder="Search for a fish..." autocomplete="off">
        </label>
        <div class="chips" id="fish-chips" role="group" aria-label="Filters"></div>
        <span class="result-count" id="fish-count" aria-live="polite"></span>
    </div>

    <div id="fish-container"></div>

    <div class="empty-state" id="emptyState" hidden>
        <strong>Nothing found</strong>
        Try a different search or filter.
    </div>


    <div class="page-footer">
        <a class="btn" href="index.html"><span aria-hidden="true">&larr;</span> Back to home</a>
        <a class="btn" href="#top">Back to top</a>
    </div>
</main>

<!-- FISH PROFILE POPUP -->
<div id="fish-modal" class="fish-modal" role="dialog" aria-modal="true" aria-labelledby="fish-modal-name">
    <div class="fish-modal-content">
        <button id="fish-modal-close" class="fish-modal-close" type="button" aria-label="Close fish profile">&times;</button>

        <div class="fish-modal-title-area">
            <h2 id="fish-modal-name">Fish Name</h2>
            <div class="fish-modal-meta">
                <span id="fish-modal-rarity" class="fish-modal-rarity">Rarity</span>
                <span id="fish-modal-value" class="fish-modal-value">0 coins</span>
            </div>
        </div>

        <div id="fish-modal-image" class="fish-modal-image">
            <div class="fantasy-fish-message">This is a fantasy fish.</div>
        </div>

        <div class="fish-modal-overview">
            <div class="label-sm fish-modal-section-label">OVERVIEW</div>
            <p id="fish-modal-overview-text">No overview available yet.</p>
        </div>
    </div>
</div>

<script src="data/fish.js"></script>
<script src="fish.js"></script>

<script src="account.js" defer></script>
<script src="ocean.js" defer></script>
</body>
</html>
